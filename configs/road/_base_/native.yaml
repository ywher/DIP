experiment:
  output_root: ../../../outputs/road
  seed: 0
model:
  type: native_r101
  pretrained: ../../../pretrained/resnet101_v2.pth
  freeze_stem: true
  prototype_scale: 20.0
train:
  max_iters: 59500
  crop_size: [1025, 1025]
  scale_range: [0.9, 1.1]
  rotate_range: [-10.0, 10.0]
  flip_probability: 0.5
  color_jitter: 0.0
  blur_probability: 0.5
  workers: 4
  base_lr: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  power: 0.9
  support_loss_weight: 0.2
  gradient_accumulation: 1
  amp: false
  print_period: 50
  checkpoint_period: 14875
  eval_period: 14875
